<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>橡胶树割胶线怎么开｜交互式现场训练</title>
  <style>
    :root {
      --forest: #123b31;
      --forest-2: #1d5747;
      --ink: #1a2b27;
      --muted: #6c7a74;
      --paper: #f4f0e6;
      --panel: #fffdf8;
      --line: #d9ded5;
      --lime: #b8d49a;
      --orange: #e98a3a;
      --red: #c94b45;
      --green: #2f7d5b;
      --shadow: 0 22px 60px rgba(16, 44, 35, .18);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #10221c; color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    body { display: grid; place-items: center; min-height: 100vh; overflow: auto; padding: clamp(0px, 2vw, 24px); }
    button { font: inherit; }
    .app { width: min(100%, 1600px); height: min(calc(100vh - clamp(0px, 4vw, 48px)), 900px); min-height: 620px; position: relative; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
    .topline { position: absolute; z-index: 10; left: 34px; right: 34px; top: 26px; display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,.82); font-size: 12px; letter-spacing: .16em; pointer-events: none; }
    .topline.light { color: var(--forest); }
    .brand { display: flex; gap: 10px; align-items: center; font-weight: 700; }
    .brand-mark { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 5px rgba(233,138,58,.22); }
    .counter { font-variant-numeric: tabular-nums; }
    .progress { position: absolute; z-index: 11; left: 0; bottom: 0; height: 5px; background: var(--orange); transition: width .3s ease; }
    .slide { position: absolute; inset: 0; padding: 78px 68px 96px; opacity: 0; visibility: hidden; transform: translateX(18px); transition: opacity .3s ease, transform .3s ease, visibility .3s; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--orange) rgba(18,59,49,.12); }
    .slide.active { opacity: 1; visibility: visible; transform: none; }
    .slide.light { background: var(--paper); }
    .slide.dark { background: var(--forest); color: #fff; }
    .kicker { margin: 0 0 15px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    .dark .kicker { color: var(--lime); }
    h1, h2, h3, p { margin: 0; }
    .title { max-width: 880px; font-size: clamp(30px, 4.4vw, 70px); line-height: 1.08; letter-spacing: -.035em; }
    .subtitle { max-width: 750px; margin-top: 16px; color: var(--muted); font-size: clamp(16px, 1.7vw, 25px); line-height: 1.55; }
    .dark .subtitle { color: rgba(255,255,255,.72); }
    .index { color: rgba(18,59,49,.14); font-size: 76px; font-weight: 900; line-height: .8; letter-spacing: -.08em; }
    .dark .index { color: rgba(255,255,255,.12); }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; margin-bottom: 27px; }
    .rule { height: 1px; margin: 22px 0 26px; background: var(--line); }
    .dark .rule { background: rgba(255,255,255,.2); }
    .btn { border: 1px solid var(--forest); background: var(--forest); color: #fff; padding: 12px 17px; cursor: pointer; border-radius: 3px; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
    .btn:hover { transform: translateY(-2px); background: var(--forest-2); }
    .btn.alt { background: transparent; color: var(--forest); }
    .dark .btn.alt { border-color: rgba(255,255,255,.35); color: #fff; }
    .micro { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .cover { padding: 0; background: var(--forest); }
    .cover::before { content: ""; position: absolute; inset: 0; background: rgba(18,59,49,.68); z-index: 1; }
    .cover-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.82) contrast(1.05); }
    .cover-copy { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; width: 62%; height: 100%; padding: 90px 0 76px 76px; color: #fff; }
    .cover-copy .title { max-width: 720px; font-size: clamp(43px, 6.3vw, 98px); }
    .cover-copy .subtitle { max-width: 580px; color: rgba(255,255,255,.78); }
    .cover-tag { display: inline-flex; width: max-content; padding: 8px 12px; border: 1px solid rgba(255,255,255,.3); color: var(--lime); font-size: 12px; letter-spacing: .15em; }
    .cover-meta { display: flex; gap: 32px; margin: 37px 0 32px; }
    .cover-meta span { display: block; color: rgba(255,255,255,.54); font-size: 12px; }
    .cover-meta strong { display: block; margin-top: 5px; color: #fff; font-size: 18px; }
    .cover-start { display: inline-flex; align-items: center; gap: 12px; width: max-content; border: 0; padding: 0; background: transparent; color: #fff; font-weight: 800; letter-spacing: .12em; cursor: pointer; }
    .cover-start i { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 50%; background: var(--orange); color: #fff; font-style: normal; font-size: 20px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .principle { position: relative; min-height: 315px; overflow: hidden; padding: 24px; background: var(--panel); border: 1px solid var(--line); }
    .principle::after { content: ""; position: absolute; right: -30px; bottom: -30px; width: 150px; height: 150px; border: 1px solid var(--lime); border-radius: 50%; opacity: .55; }
    .principle .num { color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .principle h3 { margin-top: 28px; font-size: 27px; }
    .principle p { max-width: 280px; margin-top: 15px; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .principle img { position: absolute; right: 18px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; object-fit: cover; opacity: .48; filter: saturate(.6); }
    .quiz { display: grid; grid-template-columns: 1.02fr .98fr; gap: 42px; height: 100%; }
    .quiz-main { min-width: 0; }
    .question { max-width: 760px; font-size: clamp(26px, 3.2vw, 52px); line-height: 1.14; letter-spacing: -.035em; }
    .question-note { margin-top: 13px; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .hero-image { width: 100%; height: 240px; margin-top: 25px; overflow: hidden; background: #dfe3db; }
    .hero-image img, .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .choices { display: grid; align-content: start; gap: 11px; padding-top: 12px; }
    .choices-label { color: var(--forest); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    .choice { display: flex; align-items: center; gap: 13px; min-height: 58px; padding: 12px 15px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-align: left; cursor: pointer; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
    .choice:hover { transform: translateX(3px); border-color: var(--orange); }
    .choice .letter { display: grid; flex: 0 0 auto; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: #e9efe4; color: var(--forest); font-weight: 800; }
    .choice.correct { border-color: var(--green); background: #edf7ef; }
    .choice.correct .letter { background: var(--green); color: #fff; }
    .choice.wrong { border-color: var(--red); background: #fff0ed; }
    .choice.wrong .letter { background: var(--red); color: #fff; }
    .feedback { min-height: 55px; margin-top: 18px; padding: 13px 15px; background: #e9ece5; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .feedback.ok { background: #e4f1e7; color: #22603f; }
    .feedback.bad { background: #f9e6e2; color: #873e32; }
    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .photo { padding: 9px; background: var(--panel); border: 1px solid var(--line); }
    .photo img { height: 210px; }
    .photo figcaption { padding: 11px 3px 2px; color: var(--muted); font-size: 14px; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 26px; }
    .gallery-card { padding: 9px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; transition: transform .18s ease, border-color .18s ease; }
    .gallery-card:hover { transform: translateY(-4px); border-color: var(--orange); }
    .gallery-card img { width: 100%; height: 185px; display: block; object-fit: cover; }
    .gallery-card strong { display: block; padding: 11px 3px 3px; font-size: 15px; }
    .gallery-card.correct { border: 3px solid var(--green); padding: 7px; }
    .gallery-card.wrong { border: 3px solid var(--red); padding: 7px; }
    .template-stage { display: grid; grid-template-columns: 1.05fr .95fr; gap: 22px; height: 100%; }
    .tree-zone { position: relative; min-height: 390px; overflow: hidden; background: #dbe0d7; border: 1px solid var(--line); }
    .tree-zone > img { width: 100%; height: 100%; object-fit: cover; }
    .target-zone { position: absolute; left: 42%; top: 28%; width: 35%; height: 44%; border: 2px dashed var(--orange); background: rgba(233,138,58,.12); color: #fff; text-align: center; }
    .target-zone span { display: inline-block; margin-top: 16px; padding: 5px 8px; background: rgba(18,59,49,.8); font-size: 12px; }
    .template-card { padding: 15px; background: var(--panel); border: 1px solid var(--line); cursor: grab; }
    .template-card:active { cursor: grabbing; }
    .template-card img { width: 100%; height: 230px; object-fit: contain; background: #e6eadf; }
    .template-card strong { display: block; margin-top: 12px; }
    .template-card.placed { border-color: var(--green); background: #edf7ef; }
    .diagram-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 28px; }
    .diagram { position: relative; min-height: 250px; padding: 14px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
    .diagram .slice { display: grid; grid-template-columns: 18px 1fr; height: 150px; margin: 14px auto 11px; max-width: 200px; }
    .slice .bark { background: #72503c; }
    .slice .cambium { background: var(--lime); }
    .slice .wood { position: relative; background: #ece2c4; }
    .slice .knife { position: absolute; left: 17%; width: 65%; height: 6px; background: var(--orange); transform: rotate(-13deg); box-shadow: 0 0 0 3px rgba(233,138,58,.17); }
    .slice.shallow .knife { top: 28%; }
    .slice.good .knife { top: 58%; }
    .slice.deep .knife { top: 80%; background: var(--red); }
    .diagram strong { font-size: 15px; }
    .diagram.correct { border: 3px solid var(--green); padding: 12px; }
    .diagram.wrong { border: 3px solid var(--red); padding: 12px; }
    .process { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 35px; }
    .process-card { min-height: 180px; padding: 17px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; user-select: none; }
    .process-card.selected { border-color: var(--orange); box-shadow: inset 0 4px 0 var(--orange); }
    .process-card.done { border-color: var(--green); background: #edf7ef; }
    .process-card .step-no { color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .process-card h3 { margin-top: 28px; font-size: 18px; line-height: 1.35; }
    .process-card p { margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .selected-order { display: flex; gap: 8px; flex-wrap: wrap; min-height: 26px; margin-top: 17px; color: var(--forest); font-size: 13px; }
    .order-chip { padding: 5px 8px; background: var(--lime); }
    .matching { display: grid; gap: 11px; margin-top: 25px; }
    .match-row { display: grid; grid-template-columns: 1.05fr .95fr; gap: 11px; align-items: stretch; }
    .match-problem, .match-actions button { padding: 15px; border: 1px solid var(--line); background: var(--panel); text-align: left; line-height: 1.45; }
    .match-problem { color: var(--forest); font-weight: 700; }
    .match-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .match-actions button { cursor: pointer; color: var(--ink); }
    .match-actions button:hover { border-color: var(--orange); }
    .match-actions button.selected { border-color: var(--green); background: #e4f1e7; color: #22603f; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 38px; }
    .summary-card { min-height: 210px; padding: 24px; background: var(--forest); color: #fff; }
    .summary-card .tag { color: var(--lime); font-size: 12px; font-weight: 800; letter-spacing: .15em; }
    .summary-card h3 { margin-top: 29px; font-size: 30px; }
    .summary-card p { margin-top: 13px; color: rgba(255,255,255,.72); font-size: 15px; line-height: 1.65; }
    .result { display: grid; grid-template-columns: 1fr .9fr; align-items: center; gap: 50px; height: 100%; }
    .score-wrap { display: grid; place-items: center; }
    .score-ring { display: grid; place-items: center; width: min(29vw, 330px); aspect-ratio: 1; border: 20px solid #dbe5d6; border-top-color: var(--orange); border-right-color: var(--forest); border-radius: 50%; transform: rotate(-24deg); }
    .score { transform: rotate(24deg); color: var(--forest); font-size: clamp(60px, 9vw, 132px); font-weight: 900; letter-spacing: -.08em; }
    .result-copy h2 { margin-top: 12px; font-size: clamp(29px, 4vw, 58px); line-height: 1.12; }
    .result-copy p { max-width: 590px; margin-top: 16px; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .result-actions { display: flex; gap: 10px; margin-top: 26px; }
    .nav { position: absolute; z-index: 20; left: 30px; right: 30px; bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .nav-group { display: flex; gap: 8px; }
    .nav button { width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; background: rgba(18,59,49,.82); color: #fff; cursor: pointer; }
    .slide.light ~ .nav button { color: var(--forest); }
    .toc-button { width: auto !important; padding: 0 14px; border-radius: 20px !important; font-size: 12px; letter-spacing: .08em; }
    .toc { position: absolute; z-index: 40; inset: 0; display: none; padding: 65px; background: rgba(16,34,28,.96); color: #fff; }
    .toc.open { display: block; }
    .toc h2 { font-size: 34px; }
    .toc-close { position: absolute; right: 29px; top: 22px; border: 0; background: transparent; color: #fff; font-size: 28px; cursor: pointer; }
    .toc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 27px; }
    .toc-item { padding: 13px 15px; border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.76); text-align: left; cursor: pointer; }
    .toc-item:hover { border-color: var(--orange); background: var(--orange); color: #fff; }
    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { width: 100vw; height: 100vh; min-height: 620px; }
      .slide { padding: 64px 24px 69px; overflow-y: auto; }
      .topline { left: 18px; right: 18px; top: 17px; }
      .cover-copy { width: 100%; padding: 84px 27px 70px; }
      .cover-copy .title { font-size: clamp(40px, 12vw, 67px); }
      .cover-image { opacity: .72; }
      .cover::before { background: rgba(18,59,49,.74); }
      .cover-meta { gap: 18px; margin: 27px 0; }
      .three, .summary-grid, .gallery, .diagram-grid { grid-template-columns: 1fr; }
      .principle, .summary-card { min-height: 155px; }
      .principle:nth-child(n+2), .summary-card:nth-child(n+2) { display: none; }
      .principle img { width: 80px; height: 80px; }
      .quiz, .template-stage, .result { grid-template-columns: 1fr; height: auto; gap: 18px; }
      .hero-image { height: 180px; }
      .photo-grid { grid-template-columns: 1fr 1fr; }
      .photo img { height: 130px; }
      .process { grid-template-columns: 1fr 1fr; }
      .process-card { min-height: 135px; }
      .process-card h3 { margin-top: 15px; font-size: 16px; }
      .match-row { grid-template-columns: 1fr; gap: 5px; }
      .match-actions { grid-template-columns: 1fr 1fr; }
      .tree-zone { min-height: 280px; }
      .template-card img { height: 130px; }
      .score-ring { width: 180px; border-width: 13px; }
      .result { padding-top: 35px; }
      .result-copy { text-align: center; }
      .result-actions { justify-content: center; }
      .toc { padding: 50px 24px; overflow-y: auto; }
      .toc-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main id="app" class="app" aria-label="橡胶树割胶线交互式教学"></main>
  <script>
    const asset = name => encodeURI('tp/' + name);
    const slides = [
      { type: 'cover', image: '清晨橡胶林封面.jpg' },
      { type: 'principles' },
      { type: 'beforeafter', image1: '树干清理前.jpg', image2: '树干清理后.jpg' },
      { type: 'angle' },
      { type: 'template', tree: '橡胶树倾斜树干.jpg', template: '橡胶树倾斜树干透明模板.jpg' },
      { type: 'depth' },
      { type: 'quiz', image: '跳刀割面与偏弱胶流图片.jpg', title: '胶流偏弱，要立即加深吗？', note: '试割后胶流偏弱，割面还有跳刀痕迹，你先做什么？', options: ['整条深压一刀', '停刀检查刀具、刀路和割面', '连续多割几刀观察'], correct: 1, feedback: '先找原因，再做小幅、可控的修正。检查顺序是：刀刃 → 刀路 → 割面 → 树体与环境。' },
      { type: 'gallery' },
      { type: 'quiz', image: '橡胶树快速厚削.jpg', title: '为了赶进度，可以一刀多削吗？', note: '选择能保护割面和树体周期的做法。', options: ['加快速度，一次多削', '保持薄削均匀，按标线推进', '只在割线末端加厚一刀'], correct: 1, feedback: '耗皮无法恢复，应保持薄削、均匀、连续的标准节奏。' },
      { type: 'process' },
      { type: 'matching' },
      { type: 'quiz', image: '橡胶树割面局部出现明显深伤.jpg', title: '发现疑似深伤，还继续吗？', note: '把停止扩大损伤放在继续作业之前。', options: ['完成整条割线再检查', '立即停刀并请技术人员确认', '用更厚一刀把割面修平'], correct: 1, feedback: '疑似深伤应立即停刀，避免继续扩大伤口，并请技术人员确认。' },
      { type: 'multi', image: '橡胶树割树角度略陡、中段深伤、前薄后厚、导胶正常.jpg' },
      { type: 'summary', image: '橡胶树的标准完成割线图.jpg' },
      { type: 'result', image: '清晨橡胶林封面.jpg' }
    ];
    const app = document.getElementById('app');
    const state = { current: 0, score: 0, answered: {}, order: [], matches: {}, multi: new Set(), placed: false };
    const img = (name, alt, cls) => '<img class="' + (cls || '') + '" src="' + asset(name) + '" alt="' + (alt || '') + '">';
    const feedback = (id, text, kind) => { const el = document.getElementById(id); if (!el) return; el.textContent = text; el.className = 'feedback ' + (kind || ''); };
    const choice = (text, index, action, checked) => '<button class="choice ' + (checked ? 'correct' : '') + '" data-action="' + action + '" data-option="' + index + '"><span class="letter">' + String.fromCharCode(65 + index) + '</span><span>' + text + '</span></button>';
    function slideShell(i, content, mode) { return '<section class="slide ' + (mode || 'light') + '" data-slide="' + i + '">' + content + '</section>'; }
    function renderSlide(s, i) {
      if (s.type === 'cover') return slideShell(i, '<img class="cover-image" src="' + asset(s.image) + '" alt="清晨橡胶林与接胶杯">' + '<div class="cover-copy"><span class="cover-tag">现场任务 · 交互式技能训练</span><h1 class="title">今天，你来开第一条<br>标准割线</h1><p class="subtitle">橡胶树割胶线怎么开｜角度、深度与耗皮控制</p><div class="cover-meta"><div><span>训练页</span><strong>15</strong></div><div><span>核心控制</span><strong>3 项</strong></div><div><span>建议及格线</span><strong>80%</strong></div></div><button class="cover-start" data-action="go" data-to="1"><i>→</i> 开始开线</button></div>', 'dark cover');
      if (s.type === 'principles') return slideShell(i, '<div class="head"><div><div class="kicker">P02 · 任务简报</div><h2 class="title">三项控制，决定一条割线的质量</h2><p class="subtitle">先看清目标，再进入现场判断。</p></div><div class="index">02</div></div><div class="rule"></div><div class="three"><article class="principle"><div class="num">CONTROL 01</div><h3>角度顺畅汇流</h3><p>方向要利于胶乳汇流，避免过平滞流或过陡增加割线长度。</p>' + img('标准开线橡胶树.jpg', '标准开线橡胶树') + '</article><article class="principle"><div class="num">CONTROL 02</div><h3>深度保护形成层</h3><p>开放乳管，但不能伤及形成层。深度判断比盲目加深更重要。</p>' + img('橡胶树割面局部出现明显深伤.jpg', '形成层风险') + '</article><article class="principle"><div class="num">CONTROL 03</div><h3>耗皮薄削均匀</h3><p>保持薄、连续、厚度均匀，才能延长树体可割年限。</p>' + img('薄、连续、厚度均匀.jpg', '薄削均匀') + '</article></div><div style="margin-top:24px"><button class="btn" data-action="go" data-to="2">进入现场 →</button></div>');

      document.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handleAction));

        card.addEventListener('click', placeTemplate);
        card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', 'template'));
        zone.addEventListener('dragover', e => e.preventDefault());
        zone.addEventListener('drop', e => { e.preventDefault(); placeTemplate(); });
      }
      document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(state.current + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.current - 1); } if (e.key === 'Escape') closeToc(); if (e.key === 'Home') go(0); if (e.key === 'End') go(slides.length - 1); });
      render();
    }
    function handleAction(e) {
      const el = e.currentTarget;
      const action = el.dataset.action;
      if (action === 'go') return go(Number(el.dataset.to));

      if (action === 'prev') return go(state.current - 1);
      if (action === 'toc') return openToc();
      if (action === 'close-toc') return closeToc();
      if (action === 'before') return answerQuiz(2, Number(el.dataset.option), '先完成清理，再检查刀具。泥沙会干扰刀路，试探性深割会增加伤树风险。');

      if (action.indexOf('quiz-') === 0) { const slideIndex = Number(action.slice(5)); return answerQuiz(slideIndex, Number(el.dataset.option), slides[slideIndex].feedback); }
      if (action === 'multi') return toggleMulti(Number(el.dataset.option));
      if (action === 'process') return selectStep(Number(el.dataset.step));
      if (action === 'submit-order') return submitOrder();
      if (action === 'clear-order') { state.order = []; document.querySelectorAll('.process-card').forEach(x => x.classList.remove('selected','done')); return updateOrder(); }
      if (action === 'match') return match(Number(el.dataset.row), Number(el.dataset.option));

    }
    function markScore(key, ok) { if (state.answered[key]) return; state.answered[key] = true; if (ok) state.score += 1; }
    function answerQuiz(slideIndex, option, goodText) {
      const ok = option === slides[slideIndex].correct;

      if (state.current === 14) updateResult();
